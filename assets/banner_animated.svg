<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="auto">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#122a54" />
      <stop offset="55%" stop-color="#08142b" />
      <stop offset="100%" stop-color="#040917" />
    </radialGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff0aa" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="75%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8f6b10" />
    </linearGradient>

    <!-- Frame Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8f6b10" stop-opacity="0.3" />
      <stop offset="20%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8f6b10" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes spinDrum {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(212,175,55,0.45)); }
      50% { filter: drop-shadow(0 0 25px rgba(254,240,138,0.85)); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes flyBird1 {
      0% { transform: translate(-80px, 290px) scale(0.68) rotate(-24deg); }
      100% { transform: translate(1040px, -70px) scale(0.68) rotate(-24deg); }
    }
    @keyframes flyBird2 {
      0% { transform: translate(-140px, 330px) scale(0.52) rotate(-22deg); }
      100% { transform: translate(1000px, 20px) scale(0.52) rotate(-22deg); }
    }
    @keyframes flyBird3 {
      0% { transform: translate(-30px, 260px) scale(0.82) rotate(-25deg); }
      100% { transform: translate(1080px, -110px) scale(0.82) rotate(-25deg); }
    }
    @keyframes wingFlap {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.42); }
    }

    .bg-rect { fill: url(#bgGrad); }
    .drum-group { transform-origin: 480px 180px; animation: spinDrum 60s linear infinite; }
    .title-text {
      font-family: 'Playfair Display', 'Cinzel', Georgia, serif;
      font-weight: 800;
      letter-spacing: 0.14em;
      fill: url(#goldShine);
      animation: pulseGlow 3.6s ease-in-out infinite;
    }
    .sub-text {
      font-family: 'Be Vietnam Pro', 'Segoe UI', Roboto, sans-serif;
      letter-spacing: 0.16em;
      font-weight: 600;
      fill: #fbf5df;
      opacity: 0.95;
    }
    .tag-text {
      font-family: 'Be Vietnam Pro', 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.3em;
      fill: #ffd866;
    }
    .star {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 3s ease-in-out infinite;
    }
    .bird1 { animation: flyBird1 10s linear infinite; }
    .bird2 { animation: flyBird2 10s 1.4s linear infinite; }
    .bird3 { animation: flyBird3 10s 0.6s linear infinite; }
    .wing {
      transform-origin: 0 0;
      animation: wingFlap 0.42s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="360" class="bg-rect" rx="16" />

  <!-- Outer Ornate Gold Border -->
  <rect x="14" y="14" width="932" height="332" rx="12" fill="none" stroke="url(#goldBorder)" stroke-width="1.8" />
  <rect x="20" y="20" width="920" height="320" rx="8" fill="none" stroke="#d4af37" stroke-width="0.6" stroke-opacity="0.4" />

  <!-- Traditional Vietnamese Corner Accents -->
  <g stroke="#f3e3b3" stroke-width="1.8" fill="none">
    <path d="M 14 36 L 36 14 M 14 14 L 36 36" opacity="0.6" />
    <path d="M 946 36 L 924 14 M 946 14 L 924 36" opacity="0.6" />
    <path d="M 14 324 L 36 346 M 14 346 L 36 324" opacity="0.6" />
    <path d="M 946 324 L 924 346 M 946 346 L 924 324" opacity="0.6" />
  </g>

  <!-- Rotating Dong Son Drum (Trống Đồng Đông Sơn) -->
  <g class="drum-group" opacity="0.16" stroke="#f3e3b3" fill="none">
    <!-- Center Sun (12 rays) -->
    <circle cx="480" cy="180" r="28" fill="#d4af37" fill-opacity="0.3" stroke-width="1.5" />
    <!-- 12 Radiating Sun Rays -->
    <g stroke-width="2.2">
      <line x1="480" y1="150" x2="480" y2="128" />
      <line x1="480" y1="210" x2="480" y2="232" />
      <line x1="450" y1="180" x2="428" y2="180" />
      <line x1="510" y1="180" x2="532" y2="180" />
      <line x1="459" y1="159" x2="443" y2="143" />
      <line x1="501" y1="201" x2="517" y2="217" />
      <line x1="459" y1="201" x2="443" y2="217" />
      <line x1="501" y1="159" x2="517" y2="143" />
      <line x1="468" y1="153" x2="456" y2="135" />
      <line x1="492" y1="207" x2="504" y2="225" />
      <line x1="468" y1="207" x2="456" y2="225" />
      <line x1="492" y1="153" x2="504" y2="135" />
    </g>
    <!-- Concentric Rings & Ornamental Motifs -->
    <circle cx="480" cy="180" r="58" stroke-width="1" stroke-dasharray="4,3" />
    <circle cx="480" cy="180" r="88" stroke-width="1.5" />
    <circle cx="480" cy="180" r="118" stroke-width="1" stroke-dasharray="6,4" />
    <circle cx="480" cy="180" r="150" stroke-width="2" />
    <circle cx="480" cy="180" r="180" stroke-width="1" stroke-dasharray="5,3" />
    <circle cx="480" cy="180" r="212" stroke-width="2.5" />
    <circle cx="480" cy="180" r="244" stroke-width="1" stroke-dasharray="8,5" />
    <circle cx="480" cy="180" r="276" stroke-width="2" />
  </g>

  <!-- Twinkling Stardust Elements -->
  <g fill="#ffffff">
    <polygon points="120,70 123,78 131,81 123,84 120,92 117,84 109,81 117,78" class="star" style="animation-delay: 0.2s;" />
    <polygon points="840,90 842,96 848,98 842,100 840,106 838,100 832,98 838,96" class="star" style="animation-delay: 1.1s;" />
    <polygon points="220,290 222,295 227,297 222,299 220,304 218,299 213,297 218,295" class="star" style="animation-delay: 0.7s;" />
    <polygon points="760,280 762,286 768,288 762,290 760,296 758,290 752,288 758,286" class="star" style="animation-delay: 1.8s;" />
    <circle cx="340" cy="80" r="1.6" fill="#ffd866" opacity="0.75" />
    <circle cx="620" cy="75" r="1.8" fill="#ffd866" opacity="0.8" />
    <circle cx="160" cy="200" r="1.3" fill="#ffd866" opacity="0.65" />
    <circle cx="800" cy="210" r="1.5" fill="#ffd866" opacity="0.7" />
  </g>

  <!-- Golden Swallows Flocking Gracefully -->
  <g class="bird1">
    <g transform="scale(0.85)">
      <path d="M 16 0 C 12 1.5 6 3.2 0 2.8 C -5 2.2 -8 1.2 -9 1.0 C -14 2.2 -20 4.8 -27 9.0 C -22 5.0 -18 1.5 -14 0 C -18 -1.5 -22 -5.0 -27 -9.0 C -20 -4.8 -14 -2.2 -9 -1.0 C -8 -1.2 -5 -2.2 0 -2.8 C 6 -3.2 12 -1.5 16 0 Z" fill="#ffd700" stroke="#fff8d6" stroke-width="0.7" />
      <g class="wing">
        <path d="M 2 1.8 C 5 12 1 22 -11 30 C -7 20 -6 9 -3 1.6 Z" fill="#f39c12" stroke="#fff8d6" stroke-width="0.6" />
        <path d="M 2 -1.8 C 5 -12 1 -22 -11 -30 C -7 -20 -6 -9 -3 -1.6 Z" fill="#f39c12" stroke="#fff8d6" stroke-width="0.6" />
      </g>
    </g>
  </g>

  <g class="bird2">
    <g transform="scale(0.68)">
      <path d="M 16 0 C 12 1.5 6 3.2 0 2.8 C -5 2.2 -8 1.2 -9 1.0 C -14 2.2 -20 4.8 -27 9.0 C -22 5.0 -18 1.5 -14 0 C -18 -1.5 -22 -5.0 -27 -9.0 C -20 -4.8 -14 -2.2 -9 -1.0 C -8 -1.2 -5 -2.2 0 -2.8 C 6 -3.2 12 -1.5 16 0 Z" fill="#ffd700" stroke="#fff8d6" stroke-width="0.7" />
      <g class="wing">
        <path d="M 2 1.8 C 5 12 1 22 -11 30 C -7 20 -6 9 -3 1.6 Z" fill="#f39c12" stroke="#fff8d6" stroke-width="0.6" />
        <path d="M 2 -1.8 C 5 -12 1 -22 -11 -30 C -7 -20 -6 -9 -3 -1.6 Z" fill="#f39c12" stroke="#fff8d6" stroke-width="0.6" />
      </g>
    </g>
  </g>

  <g class="bird3">
    <g transform="scale(0.95)">
      <path d="M 16 0 C 12 1.5 6 3.2 0 2.8 C -5 2.2 -8 1.2 -9 1.0 C -14 2.2 -20 4.8 -27 9.0 C -22 5.0 -18 1.5 -14 0 C -18 -1.5 -22 -5.0 -27 -9.0 C -20 -4.8 -14 -2.2 -9 -1.0 C -8 -1.2 -5 -2.2 0 -2.8 C 6 -3.2 12 -1.5 16 0 Z" fill="#ffd700" stroke="#fff8d6" stroke-width="0.7" />
      <g class="wing">
        <path d="M 2 1.8 C 5 12 1 22 -11 30 C -7 20 -6 9 -3 1.6 Z" fill="#f39c12" stroke="#fff8d6" stroke-width="0.6" />
        <path d="M 2 -1.8 C 5 -12 1 -22 -11 -30 C -7 -20 -6 -9 -3 -1.6 Z" fill="#f39c12" stroke="#fff8d6" stroke-width="0.6" />
      </g>
    </g>
  </g>

  <!-- Central Badges and Typography -->
  <!-- Top Heritage Pill Badge -->
  <g transform="translate(480, 75)">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#081229" stroke="#d4af37" stroke-width="1.2" opacity="0.95" />
    <circle cx="-135" cy="0" r="4" fill="#ffd866" />
    <circle cx="135" cy="0" r="4" fill="#ffd866" />
    <text text-anchor="middle" y="4" class="tag-text">VIỆT NAM • 20 THÁNG 11</text>
  </g>

  <!-- Main Regal Title -->
  <text x="480" y="160" text-anchor="middle" font-size="48" class="title-text">TRI ÂN THẦY CÔ</text>

  <!-- Subtitle -->
  <text x="480" y="206" text-anchor="middle" font-size="15" class="sub-text">TRỌN ĐỜI KHẮC GHI CÔNG ƠN NGƯỜI GIEO MẦM TRI THỨC</text>

  <!-- Decorative Divider with Center Gold Lotus Gem -->
  <g transform="translate(480, 245)">
    <line x1="-220" y1="0" x2="-35" y2="0" stroke="url(#goldBorder)" stroke-width="1.5" />
    <line x1="35" y1="0" x2="220" y2="0" stroke="url(#goldBorder)" stroke-width="1.5" />
    <polygon points="0,-8 8,0 0,8 -8,0" fill="#ffd700" stroke="#ffffff" stroke-width="1" />
    <circle cx="-18" cy="0" r="2.5" fill="#f3e3b3" />
    <circle cx="18" cy="0" r="2.5" fill="#f3e3b3" />
    <circle cx="-28" cy="0" r="1.5" fill="#d4af37" />
    <circle cx="28" cy="0" r="1.5" fill="#d4af37" />
  </g>

  <!-- Bottom Quote -->
  <text x="480" y="288" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="14" fill="#fbf5df" opacity="0.88">
    "Dưới ánh sáng mặt trời, không có nghề nào cao quý hơn nghề dạy học."
  </text>
  <text x="480" y="312" text-anchor="middle" font-size="10.5" class="tag-text" fill="#d4af37" opacity="0.8">
    ★ PHONG CÁCH HOÀNG GIA &amp; DI SẢN TRỐNG ĐỒNG VIỆT NAM ★
  </text>
</svg>